mprop='mainEntity' itemtype='https://schema.org/Question'><h2 itemprop='name' style='font-size:20px;color:#0f172a;margin-top:24px;'>${escAttr(q2)}</h2><div itemscope itemprop='acceptedAnswer' itemtype='https://schema.org/Answer'><p itemprop='text' style='color:#334155;font-size:16px;'>${escAttr(a2)}</p></div></div><div itemscope itemprop='mainEntity' itemtype='https://schema.org/Question'><h2 itemprop='name' style='font-size:20px;color:#0f172a;margin-top:24px;'>${escAttr(q3)}</h2><div itemscope itemprop='acceptedAnswer' itemtype='https://schema.org/Answer'><p itemprop='text' style='color:#334155;font-size:16px;'>${escAttr(a3)}</p></div></div></div><h3 style='font-size:18px;color:#0f172a;margin-top:30px;margin-bottom:14px;'>${escAttr(compareHeading)}</h3>${actionBoxHtml}<div style='background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:20px;margin-top:24px;'><h4 style='margin:0 0 6px 0;font-size:16px;color:#0f172a;'>${escAttr(freeTitle)}</h4><p style='margin:0 0 14px 0;font-size:14px;color:#475569;'>${escAttr(freeCta)}</p><form action='${WEBHOOK_URL}' method='GET' style='display:flex;flex-direction:column;gap:10px;'><input type='hidden' name='flow_type' value='FREE_LEAD'><input type='hidden' name='niche' value='${escAttr(niche)}'><input type='hidden' name='incident' value='${escAttr(incident)}'><input type='hidden' name='region' value='${escAttr(region)}'><input type='hidden' name='tier' value='${escAttr(tier)}'><input type='text' name='name' required placeholder='${escAttr(namePh)}' style='padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;'><input type='email' name='email' required placeholder='${escAttr(emailPh)}' style='padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;'><input type='text' name='loss_impact' required placeholder='${escAttr(freePh)}' style='padding:11px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;'><label style='font-size:12px;color:#475569;display:flex;align-items:flex-start;gap:8px;'><input type='checkbox' name='coreg_optin' value='yes' checked style='margin-top:3px;'><span>${escAttr(coregText)}</span></label><button type='submit' style='padding:13px;background:#0f172a;color:#ffffff;font-weight:800;font-size:14px;border:none;border-radius:6px;cursor:pointer;'>${escAttr(freeBtn)}</button></form></div><div style='margin-top:28px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;'><span>&copy; Preferred Outcomes Consumer Advocacy &amp; Public Sentiment Registry.</span><a href='/mandate/' style='color:#0f172a;font-weight:700;text-decoration:underline;'>Our Mandate / About</a></div></div></body></html>`;
