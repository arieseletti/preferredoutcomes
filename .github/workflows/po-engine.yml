async function processGlobalNews(state, newUrls) {
  const SYSTEM_PROMPT = `You are an elite SEO & consumer advocacy publisher.
CRITICAL RULES:
1. NEVER use the word "automated", "bot", or "AI" anywhere in your output. Use institutional phrasing: "Pre-Cited Statutory Dispatch", "Direct Compliance Filing", "Verified Docket".
2. NATURAL LONG-TAIL SEARCH HEADLINES: "seo_title" and "human_h1" MUST be phrased the exact way real humans search on Google (e.g., "How to Claim the AT&T Data Breach Settlement Payout" or "Airbnb Host Cancelled Last Minute: How to Force a Full Refund").
3. OPTION B MASTER INCIDENT UNIFICATION: Generate a 2-to-3 word canonical "master_incident_id" representing the core entity + event (e.g. "microsoft-365-outage", "att-data-breach", "airbnb-cancellation-refund"). Even if multiple news articles cover different angles of the same story, they MUST share the same "master_incident_id" so all leads combine into one master list.
4. STRICT MONETIZATION TIER ROUTING (DO NOT DEFAULT EVERYTHING TO TIER_1):
   - Use "TIER_1_STATUTORY" ($29.00) ONLY when a specific company/landlord/carrier owes the individual direct personal cash, bill credits, deposit refunds, or statutory damages right now (e.g. telecom/SaaS outages, Airbnb/tenant deposit withholding, bank account freezes, auto recalls).
   - Use "TIER_2_LEDGER" ($4.99) when the story is a broader corporate policy shift, utility rate hike, class-action deadline update, municipal issue, or public boycott where users want to sign a petition or send an individual $4.99 Formal Notice to decision-makers.
   - Use "TIER_3_POLL" ($1.99) when the story is a viral controversy, celebrity divorce/feud, sports referee drama, court verdict debate, or cultural flashpoint where people want to vote in a polarized public referendum poll and pin their verified comment for $1.99.

Return a strict JSON object with these keys in the native language of the feed:
- "slug": (4 to 6 word natural search slug, lowercase hyphenated)
- "master_incident_id": (2 to 3 word canonical entity-event key, lowercase hyphenated, e.g. "microsoft-365-outage")
- "lang_code": (e.g. "en", "pt", "es", "de", "fr")
- "niche": ("TENANCY", "OUTAGES", "RECALLS", "FINANCE", "POLITICS", or "CULTURE")
- "region": ("US", "CA", "UK", "EU", "BR", "ES", "MX", "DE", "FR", "AU", or "GLOBAL")
- "tier": ("TIER_1_STATUTORY", "TIER_2_LEDGER", or "TIER_3_POLL")
- "badge_text": (Short status badge in native language)
- "seo_title": (Natural search query title under 65 chars)
- "human_h1": (Natural long-tail search H1 headline)
- "ai_direct_answer": (2-sentence direct answer for search snippets)
- "q1_human", "a1_answer", "q2_human", "a2_answer", "q3_human", "a3_answer": (3 conversational search Q&As)
- "compare_heading": (Heading comparing the 3 options)
- "red_option_title", "red_option_text": (Option 1: Doing nothing / solo complaint)
- "amber_option_title", "amber_option_text": (Option 2: Waiting months / middleman fees)
- "green_option_title", "green_option_text": (Option 3: $29.00 Pre-Cited Statutory Dispatch OR $4.99 Priority Individual Notice OR $1.99 Pinned Poll Statement + Weighted Vote)
- "name_placeholder": ("Your Full Name")
- "input_placeholder": (If TIER_1: "Target Company/Landlord Name + Account/Booking Ref & Loss Amount". If TIER_2: "Target Entity + Your Personal Grievance Statement". If TIER_3: "Your Vote (Side A / Side B) + Public Comment to Pin")
- "free_input_placeholder": (If TIER_3: "Your City & Which Side You Support". Else: "City/State & Estimated Dollar Loss or Impact")
- "email_placeholder": ("Your Email Address")
- "cta_button_text": (Button text ending with "— $29.00", "— $4.99", or "— $1.99")
- "free_tool_title", "free_tool_cta", "free_button_text": (Compelling free checklist / petition signature / free poll vote capture box)`;

  let deployedCount = 0;
  const MAX_PER_RUN = 28; // Generates up to 28 global pages per 30-min run (>1,300 pages/day capacity)

  for (const feed of GLOBAL_RSS_FEEDS) {
    if (deployedCount >= MAX_PER_RUN) break;
    try {
      const res = await fetch(feed.url);
      if (!res.ok) continue;
      const xml = await res.text();
      const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].slice(0, 4);

      for (const match of items) {
        if (deployedCount >= MAX_PER_RUN) break;
        const itemXml = match[1];
        const titleMatch = itemXml.match(/<title><!\[CDATA\[(.*?)\]\]><\/title>/) || itemXml.match(/<title>(.*?)<\/title>/);
        if (!titleMatch) continue;
        const rawTitle = titleMatch[1].replace(/ - .*$/, '').trim();
        const hashId = crypto.createHash('sha256').update(rawTitle).digest('hex').slice(0, 16);

        if (state.deployed[hashId]) continue;

        const parsed = await callOpenAI(
          SYSTEM_PROMPT,
          `Headline: "${rawTitle}" | Target Niche: ${feed.niche} | Region: ${feed.region} | Language: ${feed.lang}`
        );

        if (!parsed || !parsed.slug) {
          state.deployed[hashId] = { ts: Date.now(), status: 'SKIPPED' };
          continue;
        }

        const cleanSlug = parsed.slug.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
        const cleanMaster = (parsed.master_incident_id || cleanSlug).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
        parsed.slug = cleanSlug;
        parsed.master_incident_id = cleanMaster;

        const html = buildSiloHtml(parsed, false);
        const outDir = path.join(process.cwd(), 'docket', cleanSlug);
        fs.mkdirSync(outDir, { recursive: true });
        fs.writeFileSync(path.join(outDir, 'index.html'), html, 'utf8');

        state.deployed[hashId] = {
          ts: Date.now(),
          status: 'LIVE',
          slug: cleanSlug,
          master_id: cleanMaster,
          type: parsed.niche || feed.niche,
          tier: parsed.tier || 'TIER_2_LEDGER',
          region: parsed.region || feed.region
        };

        newUrls.push(`${SITE_URL}/docket/${cleanSlug}/`);
        deployedCount++;
        console.log(`Deployed [${parsed.tier}] (${feed.region}): /docket/${cleanSlug}/ -> Master List: ${cleanMaster}`);
      }
    } catch (e) {
      console.error('Feed error:', feed.url, e.message);
    }
  }
}

async function updateSitemap(state) {
  const urls = [`${SITE_URL}/`, `${SITE_URL}/mandate/`];
  for (const [k, v] of Object.entries(state.deployed)) {
    if (v.status !== 'LIVE') continue;
    if (v.type === 'AVIATION') {
      urls.push(`${SITE_URL}/flight/${(v.slug || k).toLowerCase()}/`);
    } else if (v.slug) {
      urls.push(`${SITE_URL}/docket/${v.slug.toLowerCase()}/`);
    }
  }
  const uniqueUrls = [...new Set(urls)];
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n` +
    uniqueUrls.map(u => `  <url><loc>${u}</loc><changefreq>daily</changefreq><priority>0.8</priority></url>`).join('\n') +
    `\n</urlset>`;
  fs.writeFileSync(path.join(process.cwd(), 'sitemap.xml'), xml, 'utf8');
}

async function pingIndexNow(newUrls) {
  if (!newUrls.length) return;
  try {
    await fetch('https://api.indexnow.org/indexnow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({
        host: 'preferredoutcomes.org',
        key: INDEXNOW_KEY,
        keyLocation: `${SITE_URL}/${INDEXNOW_KEY}.txt`,
        urlList: newUrls.slice(0, 100)
      })
    });
  } catch (e) {}
}

async function run() {
  const state = loadState();
  const newUrls = [];
  await processGlobalNews(state, newUrls);
  saveState(state);
  await updateSitemap(state);
  await pingIndexNow(newUrls);
}

run();
