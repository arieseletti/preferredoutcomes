name: PO Global Discovery & Silo Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: po-engine-run
  cancel-in-progress: true

jobs:
  deploy-silos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PO Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
        run: node scripts/po-engine.mjs

      - name: Commit & Push All Generated Pages
        run: |
          git config user.name "PO Automated Engine"
          git config user.email "bot@preferredoutcomes.org"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy global silos & sitemap [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No new silos to commit."
          fi
