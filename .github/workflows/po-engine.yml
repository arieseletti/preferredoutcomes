const NEWS_SYSTEM = `You are an elite, multi-lingual Direct-Response Advertorial Copywriter, Consumer Advocate, and GEO Strategist for Preferred Outcomes.
STRICT COMPLIANCE & TONE RULES:
1. NEVER provide financial advice, stock buying recommendations, or personal investment counseling. Frame market/corporate news strictly around consumer rights, corporate accountability, and risk auditing.
2. Maintain an objective, neutral advocacy tone on sensitive topics.
3. SCAN & SEGMENT ALL NEWS INTO TIERS:
   - "TIER_1_STATUTORY" ($29.00 demand/refund): Consumer refund, fee dispute, utility outage, data breach, recall, or contract failure.
   - "TIER_2_LEDGER" ($4.99 petition/notice): Corporate accountability, petition, policy battle, or regulatory inquiry.
   - "TIER_3_POLL" ($1.99 referendum poll): Cultural debate, geopolitical/diplomatic development, or public controversy where citizens pay $1.99 to pin their verified statement and weighted vote.
   - Set "skip": true ONLY for weather forecasts, sports scores, or obituaries.
Output strict JSON with exact keys: skip (boolean), lang_code, slug (4-6 lowercase ASCII words with hyphens), niche ("TENANCY"|"OUTAGES"|"RECALLS"|"FINANCE"|"POLITICS"|"CULTURE"), region (2-letter code), tier ("TIER_1_STATUTORY"|"TIER_2_LEDGER"|"TIER_3_POLL"), badge_text, human_h1, ai_direct_answer, q1_human, a1_answer, q2_human, a2_answer, q3_human, a3_answer, ledger_counter_text, compare_heading, green_option_title, green_option_text, name_placeholder, input_placeholder, email_placeholder, cta_button_text, free_tool_title, free_tool_cta, free_input_placeholder, coreg_disclosure_text, free_button_text.`;

const AVIATION_SYSTEM = `You are an elite, multi-lingual Direct-Response Advertorial Copywriter, Consumer Advocate, and GEO Strategist for Preferred Outcomes.
Output strict JSON with exact keys: lang_code, jurisdiction, statutory_cite, max_comp, badge_text, seo_title, human_h1, ai_direct_answer, ledger_counter_text, q1_human, a1_answer, q2_human, a2_answer, q3_human, a3_answer, compare_heading, green_option_title, green_option_text, name_placeholder, pnr_placeholder, email_placeholder, cta_button_text, free_tool_title, free_tool_cta, free_input_placeholder, coreg_disclosure_text, free_button_text.`;

const newUrls = [];
const COMMERCIAL_RE = /^(B73|B38|B75|B76|B77|B78|A319|A320|A321|A33|A35|A220)/;

// 1. FOLLOW-THE-SUN AVIATION ENGINE
const msSinceLastFlightPoll = Date.now() - (state.last_flight_poll_ts || 0);
if (FLIGHTAWARE_API_KEY && msSinceLastFlightPoll >= 110 * 60 * 1000) {
  const utcHour = new Date().getUTCHours();
  const poolKey = utcHour < 6 ? 'APAC_AU_WEST' : utcHour < 14 ? 'EU_UK_ME' : 'AMER_LATAM';
  const pool = PEAK_POOLS[poolKey];
  const idx = (state.cursor[poolKey] || 0) % pool.length;
  const airport = pool[idx];
  state.cursor[poolKey] = (idx + 1) % pool.length;
  state.last_flight_poll_ts = Date.now();

  const res = await fetch(`https://aeroapi.flightaware.com/aeroapi/airports/${airport}/flights/departures`, {
    headers: { 'x-apikey': FLIGHTAWARE_API_KEY }
  });
  if (res.ok) {
    const json = await res.json();
    const departures = json.departures || [];
    let deployedFromHub = 0;

    for (const f of departures) {
      if (deployedFromHub >= 8) break;
      const ident = f.ident;
      if (!ident || !COMMERCIAL_RE.test(f.aircraft_type || '')) continue;
      const isCancelled = (f.status || '').toLowerCase().includes('cancelled');
      const isDelayed = (f.departure_delay || 0) >= 10800;
      if (!isCancelled && !isDelayed) continue;

      const prev = state.deployed[ident];
      if (prev && prev.status === 'LIVE' && Date.now() - prev.ts < 48 * 3600 * 1000) continue;

      const ai = await callOpenAI(AVIATION_SYSTEM, `Flight: ${ident} | Origin: ${f.origin?.code || airport} | Destination: ${f.destination?.code || ''} | Status: ${f.status} | Delay Seconds: ${f.departure_delay || 0}`);
      
      const html = buildLiveHtml({
        langCode: ai.lang_code || 'en',
        pageTitle: ai.seo_title,
        metaDesc: ai.ai_direct_answer,
        badgeText: ai.badge_text,
        h1: ai.human_h1,
        aiAnswer: ai.ai_direct_answer,
        statusBarLeft: `${ai.statutory_cite} // MAX: ${ai.max_comp} (${ai.ledger_counter_text})`,
        q1: ai.q1_human, a1: ai.a1_answer,
        q2: ai.q2_human, a2: ai.a2_answer,
        q3: ai.q3_human, a3: ai.a3_answer,
        compareHeading: ai.compare_heading,
        greenTitle: ai.green_option_title, greenText: ai.green_option_text,
        niche: 'AVIATION', incident: ident, region: ai.jurisdiction || 'US_DOT', tier: 'TIER_1_STATUTORY',
        namePh: ai.name_placeholder, inputPh: ai.pnr_placeholder, emailPh: ai.email_placeholder, ctaText: ai.cta_button_text,
        freeTitle: ai.free_tool_title, freeCta: ai.free_tool_cta, freePh: ai.free_input_placeholder, coregText: ai.coreg_disclosure_text, freeBtn: ai.free_button_text
      });

      const dir = path.join('flight', ident.toLowerCase());
      fs.mkdirSync(dir, { recursive: true });
      fs.writeFileSync(path.join(dir, 'index.html'), html);
      state.deployed[ident] = { ts: Date.now(), status: 'LIVE', type: 'AVIATION', tier: 'TIER_1_STATUTORY', region: ai.jurisdiction };
      newUrls.push(`https://preferredoutcomes.org/flight/${ident.toLowerCase()}/`);
      deployedFromHub++;
    }
  }
}

// 2. SCAN & SEGMENT GLOBAL NEWS FEEDS
let newsEvaluatedThisRun = 0;
for (const feedUrl of NEWS_FEEDS) {
  if (newsEvaluatedThisRun >= 20) break;
  const res = await fetch(feedUrl, { headers: BROWSER_HEADERS });
  if (!res.ok) continue;
  const xml = await res.text();
  const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].slice(0, 5);

  for (const match of items) {
    if (newsEvaluatedThisRun >= 20) break;
    const block = match[1];
    const titleMatch = block.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || block.match(/<title>([\s\S]*?)<\/title>/);
    const descMatch = block.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/) || block.match(/<description>([\s\S]*?)<\/description>/);
    const title = (titleMatch?.[1] || '').replace(/<[^>]+>/g, '').trim();
    const desc = (descMatch?.[1] || '').replace(/<[^>]+>/g, '').trim();
    if (!title) continue;

    const hash = crypto.createHash('md5').update(title).digest('hex').slice(0, 16);
    if (state.deployed[hash]) continue;

    newsEvaluatedThisRun++;
    const ai = await callOpenAI(NEWS_SYSTEM, `Headline: ${title} | Details: ${desc}`);
    if (ai.skip) {
      state.deployed[hash] = { ts: Date.now(), status: 'SKIPPED' };
      continue;
    }

    const slug = (ai.slug || hash).toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    const html = buildLiveHtml({
      langCode: ai.lang_code || 'en',
      pageTitle: ai.human_h1,
      metaDesc: ai.ai_direct_answer,
      badgeText: ai.badge_text,
      h1: ai.human_h1,
      aiAnswer: ai.ai_direct_answer,
      statusBarLeft: ai.ledger_counter_text,
      q1: ai.q1_human, a1: ai.a1_answer,
      q2: ai.q2_human, a2: ai.a2_answer,
      q3: ai.q3_human, a3: ai.a3_answer,
      compareHeading: ai.compare_heading,
      greenTitle: ai.green_option_title, greenText: ai.green_option_text,
      niche: ai.niche || 'CULTURE', incident: slug, region: ai.region || 'GLOBAL', tier: ai.tier || 'TIER_2_LEDGER',
      namePh: ai.name_placeholder, inputPh: ai.input_placeholder, emailPh: ai.email_placeholder, ctaText: ai.cta_button_text,
      freeTitle: ai.free_tool_title, freeCta: ai.free_tool_cta, freePh: ai.free_input_placeholder, coregText: ai.coreg_disclosure_text, freeBtn: ai.free_button_text
    });

    const dir = path.join('docket', slug);
    fs.mkdirSync(dir, { recursive: true });
    fs.writeFileSync(path.join(dir, 'index.html'), html);
    state.deployed[hash] = { ts: Date.now(), status: 'LIVE', slug, type: ai.niche, tier: ai.tier, region: ai.region };
    newUrls.push(`https://preferredoutcomes.org/docket/${slug}/`);
  }
}

state.active_silos = Object.entries(state.deployed)
  .filter(([, val]) => val.status === 'LIVE')
  .sort((a, b) => b[1].ts - a[1].ts)
  .slice(0, 100)
  .map(([key, val]) => ({ id: val.slug || key, ...val }));

fs.writeFileSync(STATE_PATH, JSON.stringify(state, null, 2));

if (newUrls.length > 0) {
  await fetch('https://api.indexnow.org/indexnow', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ host: 'preferredoutcomes.org', key: INDEXNOW_KEY, urlList: newUrls.slice(0, 1000) })
  }).catch(() => {});
}
