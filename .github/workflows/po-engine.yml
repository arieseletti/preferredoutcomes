name: PO Intelligence Desk Engine

on:
  schedule:
    # Hourly: processes pending One-Time orders & Monday 06:00 local-time Weekly Briefs
    - cron: '0 * * * *'
    # Daily 14:00 UTC (9:00 AM EST): lifecycle reminders & throttled outreach batch
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode to run manually'
        required: true
        default: 'fulfill'
        type: choice
        options:
          - fulfill
          - lifecycle
          - outreach
          - sitemap

permissions:
  contents: write

concurrency:
  group: po-intel-engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PO Intelligence Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PO_MODE: ${{ github.event.inputs.mode || 'fulfill' }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            node scripts/po-engine.mjs lifecycle
            node scripts/po-engine.mjs outreach
          else
            node scripts/po-engine.mjs "$PO_MODE"
          fi

      - name: Commit Sitemap Updates (If Any)
        run: |
          git config user.name "PO Engine"
          git config user.email "bot@preferredoutcomes.org"
          git add sitemap.xml briefings/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update briefings and sitemap.xml"
            git push origin main
          fi
