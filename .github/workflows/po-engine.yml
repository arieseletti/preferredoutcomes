const AVIATION_SYSTEM = `You are an elite, multi-lingual Direct-Response Advertorial Copywriter, Consumer Advocate, and GEO (Generative Engine Optimization) Strategist for Preferred Outcomes.
1. Detect primary language of departure airport (Portuguese SB*, Spanish LE*/MM*/SK*, French LF*/CYUL/LSGG, German ED*/LSZH, Italian LI*, Dutch EHAM, Turkish LT*, Hebrew LLBG, Arabic OE*, Japanese RJ*, Korean RK*, English US/CA/UK/IE/AU/NZ). Write ALL visible copy in that native language (plus 1-line English sub-summary in ai_direct_answer for non-English airports).
2. Output strict JSON with exact keys: lang_code, jurisdiction ("APPR" if C, "UK261" if EG, "EU261" if LF/ED/EH/LE/LI/EI/LS, "ANAC_400" if SB, "PROFECO" if MM, "LATAM_SAC" if SK, "AU_ACL" if Y, "NZ_CGA" if NZ, "SHY_PASS" if LT, "ISRAEL_ASL" if LL, "GACA" if OE, "APAC_STATUTE" if RJ/RK, else "US_DOT"), statutory_cite, max_comp, badge_text, seo_title, human_h1, ai_direct_answer, ledger_counter_text, q1_human, a1_answer, q2_human, a2_answer, q3_human, a3_answer, compare_heading, red_option_title, red_option_text, amber_option_title, amber_option_text, green_option_title, green_option_text, name_placeholder, pnr_placeholder, email_placeholder, cta_button_text, free_tool_title, free_tool_cta, free_input_placeholder, coreg_disclosure_text, free_button_text.`;

const NEWS_SYSTEM = `You are an elite, multi-lingual Direct-Response Advertorial Copywriter, Consumer Advocate, and GEO Strategist for Preferred Outcomes.
1. SCAN & SEGMENT ALL NEWS: Decide if the headline has ANY monetizable consumer, civic, or viral angle:
   - "TIER_1_STATUTORY" ($29.00): People are hit by an outage, cancellation, recall, data breach, fee trap, bank freeze, or corporate failure where they want a refund, bill credit, compensation, or statutory demand.
   - "TIER_2_LEDGER" ($4.99): Political controversy, corporate boycott, municipal/school/workplace policy battle, or public outrage where people want to sign a petition OR dispatch an individual notice.
   - "TIER_3_POLL" ($1.99): Celebrity scandal, divorce, viral feud, cultural drama, or polarized debate where people want to vote in a live referendum poll and pin their verified comment.
   - Set "skip": true ONLY if the headline is a dry weather forecast, sports score, or obituary with zero public outrage or consumer impact.
2. Write ALL visible copy 100% in the impacted audience's native language.
Output strict JSON with exact keys: skip (boolean), lang_code, slug (4-6 lowercase ASCII words with hyphens), niche ("TENANCY"|"OUTAGES"|"RECALLS"|"FINANCE"|"POLITICS"|"CULTURE"), region (2-letter code), tier ("TIER_1_STATUTORY"|"TIER_2_LEDGER"|"TIER_3_POLL"), badge_text, human_h1, ai_direct_answer, q1_human, a1_answer, q2_human, a2_answer, q3_human, a3_answer, ledger_counter_text, compare_heading, red_option_title, red_option_text, amber_option_title, amber_option_text, green_option_title, green_option_text, name_placeholder, input_placeholder, email_placeholder, cta_button_text, free_tool_title, free_tool_cta, free_input_placeholder, coreg_disclosure_text, free_button_text.`;

const newUrls = [];
const COMMERCIAL_RE = /^(B73|B38|B75|B76|B77|B78|A319|A320|A321|A33|A35|A220)/;

// 1. FOLLOW-THE-SUN AVIATION ENGINE (1 Airport Call every 2 Hours = 12 calls/day = $0.12/day = $3.60/month!)
const msSinceLastFlightPoll = Date.now() - (state.last_flight_poll_ts || 0);
if (FLIGHTAWARE_API_KEY && msSinceLastFlightPoll >= 110 * 60 * 1000) {
  const utcHour = new Date().getUTCHours();
  const poolKey = utcHour < 6 ? 'APAC_AU_WEST' : utcHour < 14 ? 'EU_UK_ME' : 'AMER_LATAM';
  const pool = PEAK_POOLS[poolKey];
  const idx = (state.cursor[poolKey] || 0) % pool.length;
  const airport = pool[idx];
  state.cursor[poolKey] = (idx + 1) % pool.length;
  state.last_flight_poll_ts = Date.now();

  console.log(`[Follow-The-Sun Aviation] Polling peak hub ${airport} (${poolKey}, 1 API call = $0.01)`);
  try {
    const res = await fetch(`https://aeroapi.flightaware.com/aeroapi/airports/${airport}/flights/departures`, {
      headers: { 'x-apikey': FLIGHTAWARE_API_KEY }
    });
    if (res.ok) {
      const json = await res.json();
      const departures = json.departures || [];
      let deployedFromHub = 0;

      for (const f of departures) {
        if (deployedFromHub >= 8) break; // Cap OpenAI calls per hub
        const ident = f.ident;
        if (!ident || !COMMERCIAL_RE.test(f.aircraft_type || '')) continue;
        const isCancelled = (f.status || '').toLowerCase().includes('cancelled');
        const isDelayed = (f.departure_delay || 0) >= 10800;
        if (!isCancelled && !isDelayed) continue;

        const prev = state.deployed[ident];
        if (prev && prev.status === 'LIVE' && Date.now() - prev.ts < 48 * 3600 * 1000) continue;

        console.log(`Deploying LIVE flight: ${ident} (${airport})`);
        const ai = await callOpenAI(
          AVIATION_SYSTEM,
          `Flight: ${ident} | Origin: ${f.origin?.code || airport} | Destination: ${f.destination?.code || ''} | Status: ${f.status} | Delay Seconds: ${f.departure_delay || 0}`
        );

        const html = buildLiveHtml({
          langCode: ai.lang_code || 'en',
          pageTitle: ai.seo_title,
          metaDesc: ai.ai_direct_answer,
          badgeText: ai.badge_text,
          h1: ai.human_h1,
          aiAnswer: ai.ai_direct_answer,
          statusBarLeft: `${ai.statutory_cite} // MAX: ${ai.max_comp} (${ai.ledger_counter_text})`,
          q1: ai.q1_human, a1: ai.a1_answer,
          q2: ai.q2_human, a2: ai.a2_answer,
          q3: ai.q3_human, a3: ai.a3_answer,
          compareHeading: ai.compare_heading,
          redTitle: ai.red_option_title, redText: ai.red_option_text,
          amberTitle: ai.amber_option_title, amberText: ai.amber_option_text,
          greenTitle: ai.green_option_title, greenText: ai.green_option_text,
          niche: 'AVIATION',
          incident: ident,
          region: ai.jurisdiction || 'US_DOT',
          tier: 'TIER_1_STATUTORY',
          namePh: ai.name_placeholder,
          inputPh: ai.pnr_placeholder,
          emailPh: ai.email_placeholder,
          ctaText: ai.cta_button_text,
          freeTitle: ai.free_tool_title,
          freeCta: ai.free_tool_cta,
          freePh: ai.free_input_placeholder,
          coregText: ai.coreg_disclosure_text,
          freeBtn: ai.free_button_text
        });

        const dir = path.join('flight', ident.toLowerCase());
        fs.mkdirSync(dir, { recursive: true });
        fs.writeFileSync(path.join(dir, 'index.html'), html);

        state.deployed[ident] = { ts: Date.now(), status: 'LIVE', type: 'AVIATION', tier: 'TIER_1_STATUTORY', region: ai.jurisdiction };
        newUrls.push(`https://preferredoutcomes.org/flight/${ident.toLowerCase()}/`);
        deployedFromHub++;
      }
    }
  } catch (err) {
    console.error(`Airport ${airport} error:`, err.message);
  }
}

// Convert any >48h LIVE flights into Retroactive Standby Archive pages
for (const [ident, info] of Object.entries(state.deployed)) {
  if (info.type === 'AVIATION' && info.status === 'LIVE' && Date.now() - info.ts > 48 * 3600 * 1000) {
    const dir = path.join('flight', ident.toLowerCase());
    fs.mkdirSync(dir, { recursive: true });
    fs.writeFileSync(path.join(dir, 'index.html'), buildStandbyFlightHtml(ident));
    state.deployed[ident].status = 'DEAD';
  }
}

// 2. SCAN & SEGMENT GLOBAL NEWS FEEDS EVERY 30 MINS ($0 RSS Cost)
let newsEvaluatedThisRun = 0;
for (const feedUrl of NEWS_FEEDS) {
  if (newsEvaluatedThisRun >= 25) break; // Processes up to 25 brand-new headlines every 30 mins (1,200/day!)
  try {
    const res = await fetch(feedUrl);
    if (!res.ok) continue;
    const xml = await res.text();
    const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)].slice(0, 6);

    for (const match of items) {
      if (newsEvaluatedThisRun >= 25) break;
      const block = match[1];
      const titleMatch = block.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || block.match(/<title>([\s\S]*?)<\/title>/);
      const descMatch = block.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/) || block.match(/<description>([\s\S]*?)<\/description>/);
      const title = (titleMatch?.[1] || '').replace(/<[^>]+>/g, '').trim();
      const desc = (descMatch?.[1] || '').replace(/<[^>]+>/g, '').trim();
      if (!title) continue;

      const hash = crypto.createHash('md5').update(title).digest('hex').slice(0, 16);
      if (state.deployed[hash]) continue;

      newsEvaluatedThisRun++;
      const ai = await callOpenAI(NEWS_SYSTEM, `Headline: ${title} | Details: ${desc}`);
      if (ai.skip) {
        state.deployed[hash] = { ts: Date.now(), status: 'SKIPPED' };
        continue;
      }

      const slug = (ai.slug || hash).toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
      console.log(`Deploying News Docket [${ai.tier}]: ${slug}`);

      const html = buildLiveHtml({
        langCode: ai.lang_code || 'en',
        pageTitle: ai.human_h1,
        metaDesc: ai.ai_direct_answer,
        badgeText: ai.badge_text,
        h1: ai.human_h1,
        aiAnswer: ai.ai_direct_answer,
        statusBarLeft: ai.ledger_counter_text,
        q1: ai.q1_human, a1: ai.a1_answer,
        q2: ai.q2_human, a2: ai.a2_answer,
        q3: ai.q3_human, a3: ai.a3_answer,
        compareHeading: ai.compare_heading,
        redTitle: ai.red_option_title, redText: ai.red_option_text,
        amberTitle: ai.amber_option_title, amberText: ai.amber_option_text,
        greenTitle: ai.green_option_title, greenText: ai.green_option_text,
        niche: ai.niche || 'CULTURE',
        incident: slug,
        region: ai.region || 'GLOBAL',
        tier: ai.tier || 'TIER_2_LEDGER',
        namePh: ai.name_placeholder,
        inputPh: ai.input_placeholder,
        emailPh: ai.email_placeholder,
        ctaText: ai.cta_button_text,
        freeTitle: ai.free_tool_title,
        freeCta: ai.free_tool_cta,
        freePh: ai.free_input_placeholder,
        coregText: ai.coreg_disclosure_text,
        freeBtn: ai.free_button_text
      });

      const dir = path.join('docket', slug);
      fs.mkdirSync(dir, { recursive: true });
      fs.writeFileSync(path.join(dir, 'index.html'), html);

      state.deployed[hash] = { ts: Date.now(), status: 'LIVE', slug, type: ai.niche, tier: ai.tier, region: ai.region };
      newUrls.push(`https://preferredoutcomes.org/docket/${slug}/`);
    }
  } catch (err) {
    console.error(`Feed error:`, err.message);
  }
}

// 3. SAVE STATE FOR DASHBOARD & PING INDEXNOW
state.active_silos = Object.entries(state.deployed)
  .filter(([, val]) => val.status === 'LIVE')
  .sort((a, b) => b[1].ts - a[1].ts)
  .slice(0, 100)
  .map(([key, val]) => ({ id: val.slug || key, ...val }));

fs.writeFileSync(STATE_PATH, JSON.stringify(state, null, 2));

if (newUrls.length > 0) {
  await fetch('https://api.indexnow.org/indexnow', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      host: 'preferredoutcomes.org',
      key: INDEXNOW_KEY,
      urlList: newUrls.slice(0, 1000)
    })
  }).catch(() => {});
  console.log(`Successfully deployed ${newUrls.length} new silos.`);
}
