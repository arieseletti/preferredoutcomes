name: PO Global Discovery & Silo Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: po-engine-run
  cancel-in-progress: false

jobs:
  deploy-silos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull Latest Before Run
        run: |
          git config user.name "PO Engine"
          git config user.email "bot@preferredoutcomes.org"
          git pull origin main --no-edit || true

      - name: Run PO Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
        run: node scripts/po-engine.mjs

      - name: Commit & Push All Generated Pages
        run: |
          git config user.name "PO Engine"
          git config user.email "bot@preferredoutcomes.org"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy v14 global advertorial silos and update silos.json"
            git pull --rebase -X theirs origin main || true
            git push origin main
          else
            echo "No new silos to commit."
          fi
