<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P/O // Preferred Outcomes — Secure Intake Gateway</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23090a0f' stroke='%23ffffff' stroke-width='4'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='monospace' font-weight='700' font-size='26' letter-spacing='-1'%3EP/O%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #0f111a;
      --border: #222638;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #388bfd;
      --success: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .terminal-box {
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 2rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-weight: 700;
    }
    .status-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
    }
    h1 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: #fff;
      text-transform: uppercase;
    }
    p {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .query-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 0.9rem 1rem;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .query-input:focus {
      border-color: var(--accent);
    }
    .submit-btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 0.9rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <div class="header-row">
      <span>[P/O] SECURE GATEWAY</span>
      <span class="status-badge">ONLINE</span>
    </div>

    <h1>Statutory Incident Intake</h1>
    <p>Enter your designated case identifier, flight code, or statutory docket reference to access your secure action parameters.</p>

    <form class="input-form" onsubmit="handleQuerySubmit(event)">
      <input type="text" id="incident-code" class="query-input" placeholder="e.g. LH400, TORONTO-TENANT-01" required autocomplete="off" />
      <button type="submit" class="submit-btn">Access Secure Docket //</button>
    </form>

    <div class="footer-note">
      PREFERRED OUTCOMES REGISTRY &bull; ENCRYPTED ROUTING
    </div>
  </div>

  <script>
    function handleQuerySubmit(event) {
      event.preventDefault();
      const code = document.getElementById('incident-code').value.trim();
      if (code) {
        // Directs user straight to the secure subfolder docket path
        window.location.href = '/' + encodeURIComponent(code);
      }
    }
  </script>

</body>
</html>
