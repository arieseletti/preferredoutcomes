<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferred Outcomes | Flight Statutory Demand Dossier</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .flight-id {
            color: var(--accent);
            font-family: monospace;
        }

        p.description {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buy-button {
            display: inline-block;
            width: 100%;
            background-color: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            transition: background-color 0.2s;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .buy-button:hover {
            background-color: var(--accent-hover);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 20px;
            }
            .buy-button {
                font-size: 14px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Statutory Verification Notice</div>
        <h1>Flight Dossier: <span id="flightIdentDisplay" class="flight-id">Loading...</span></h1>
        
        <p class="description" id="hookText">
            Verifying flight disruption data and compiling institutional statutory demand documentation...
        </p>

        <a href="#" id="checkoutButton" class="buy-button">Acquire Statutory Demand Dossier - $15.00</a>

        <div class="footer-note">
            Secure checkout powered by Gumroad. Instant PDF dossier delivery.
        </div>
    </div>

    <script>
        // Cleanly reads the flight code from the path (e.g., preferredoutcomes.org/ACA119 -> ACA119)
        const pathSegments = window.location.pathname.replace(/^\/+/, '').split('/');
        const flightIdent = pathSegments[0] ? pathSegments[0].toUpperCase() : '';

        if (flightIdent && flightIdent !== 'INDEX.HTML') {
            document.getElementById('flightIdentDisplay').textContent = flightIdent;
            document.getElementById('hookText').textContent = `This flight qualifies for maximum statutory cash settlement under the applicable regulatory framework due to verified disruption. Download your complete legal dossier and formal airline claim package instantly.`;
            
            // Dynamic Gumroad product link matching your Make.com backend
            document.getElementById('checkoutButton').href = `https://gumroad.com/l/${flightIdent.toLowerCase()}`;
        } else {
            document.getElementById('flightIdentDisplay').textContent = 'SYSTEM READY';
            document.getElementById('hookText').textContent = 'Please navigate to a specific flight URL (e.g., preferredoutcomes.org/ACA119) to access a verified statutory claim dossier.';
            document.getElementById('checkoutButton').style.display = 'none';
        }
    </script>

</body>
</html>
