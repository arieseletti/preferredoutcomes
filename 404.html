<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Preferred Outcomes // Intelligence Desk</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#14362B" />

  <!-- Inline SVG Favicon: Editorial P/O Monogram on Dark Forest Green (#14362B) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314362B'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' fill='%23FAF9F6' font-family='Georgia,serif' font-size='13.5' font-weight='500' letter-spacing='0.4'%3EP/O%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-paper: #FAF9F6;
      --bg-card: #FFFFFF;
      --border-hairline: #E5E2DC;
      --ink-primary: #141413;
      --ink-muted: #57534E;
      --accent-forest: #14362B;
      --accent-forest-hover: #0E271F;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-top: 3px solid var(--accent-forest);
      border-radius: 2px;
      padding: 2.25rem 2rem;
    }

    .eyebrow {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent-forest);
      margin-bottom: 0.9rem;
    }

    h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 400;
      font-size: 1.9rem;
      line-height: 1.18;
      color: var(--ink-primary);
      margin-bottom: 0.85rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent-forest);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.78rem 1.35rem;
      border-radius: 2px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-forest-hover);
    }

    .footer-meta {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-hairline);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">HTTP 404 // Record Not Found</span>
    <h1>This document is no longer on file.</h1>
    <p>
      The page you requested has been archived or does not exist. Return to the main desk to view active practices and fee schedules.
    </p>
    <a href="/" class="btn">Return to Intelligence Desk &rarr;</a>
    <div class="footer-meta">Preferred Outcomes // Intelligence Desk</div>
  </main>
</body>
</html>
